<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Coffee Shop</title>
</head>
<body>

    <h1>Coffee Shop</h1>

    <div class="products">

        <div class="product">
            <img src="https://kyivcityroast.com.ua/wp-content/uploads/2025/01/img_6890-750.webp" alt="Американо">
            <h3>Американо</h3>
            <p>1200 тг</p>
            <button type="button">Купить</button>
        </div>

        <div class="product">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQZV8Vmh_G1QIMGy7F_PPZGwi1LsofPWyMctjOCugAg0mXrNmpEU02sq0M&s=10" alt="Латте">
            <h3>Латте</h3>
            <p>1500 тг</p>
            <button type="button">Купить</button>
        </div>

        <div class="product">
            <img src="https://www.nescafe.kz/sites/default/files/2024-09/GettyImages-1466623971.jpg" alt="Капучино">
            <h3>Капучино</h3>
            <p>1300 тг</p>
            <button type="button">Купить</button>
        </div>

    </div>

    <script src="script.js"></script>
<!-- Контейнер для кофейного меню -->
<div class="products">
    
    <!-- Карточка 1: Эспрессо (ссылка gstatic с последнего скрина) -->
    <div class="product">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRI9bM-YQZs1_aspJ6Zjom0X-Gy518C_nmVhOrFWLjnlWpsdfUG12t8TII&s=10" alt="Эспрессо">
        <h3>Эспрессо</h3>
        <p>Классический крепкий кофе.</p>
    </div>

    <!-- Карточка 2: Доппио (ссылка insales-shop) -->
    <div class="product">
        <img src="https://cdn.insales-shop.ru/images/articles/1/4967/1471335/162503773975_1_.jpg" alt="Доппио">
        <h3>Доппио</h3>
        <p>Двойная порция эспрессо.</p>
    </div>

    <!-- Карточка 3: Макиато (ссылка vending.by) -->
    <div class="product">
        <img src="https://vending.by/wp-content/uploads/2022/06/coffee-macchiato-1170x780.jpg" alt="Макиато">
        <h3>Макиато</h3>
        <p>Кофе с нежной молочной пеной.</p>
    </div>

</div>
<!-- Контейнер для кофейного меню -->
<div class="products">

</div>
</body>
</html>
